name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Raw Java Version: $RAW_VERSION"
          
          MAJOR_VERSION=$(echo "$RAW_VERSION" | awk -F'.' '{print $1}')
          if [ "$MAJOR_VERSION" = "1" ]; then
            MAJOR_VERSION=$(echo "$RAW_VERSION" | awk -F'.' '{print $2}')
          fi
          
          if [ -z "$MAJOR_VERSION" ]; then
            echo "::error::Could not detect active Java version."
            exit 1
          fi
          
          echo "Active Java Major Version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $MAJOR_VERSION."
            exit 1
          fi
          echo "Java environment verification passed (Java $MAJOR_VERSION >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Debug keystore already exists at $KEYSTORE_PATH"
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
            
            if [ -f "$KEYSTORE_PATH" ]; then
              echo "Temporary debug keystore successfully created at $KEYSTORE_PATH"
            else
              echo "::error::Failed to create temporary debug keystore at $KEYSTORE_PATH"
              exit 1
            fi
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        id: verify_apk
        run: |
          APK_TARGET="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_TARGET" ]; then
            echo "::error::Expected APK not found at $APK_TARGET"
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          
          if [ ! -s "$APK_TARGET" ]; then
            echo "::error::APK file exists but is empty."
            exit 1
          fi
          
          case "$APK_TARGET" in
            *.apk) ;;
            *) echo "::error::File does not have .apk extension"; exit 1 ;;
          esac
          
          echo "APK successfully verified at $APK_TARGET"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_RELEASE_DIR=$(mktemp -d)
          ASSET_DEST="$TEMP_RELEASE_DIR/app-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_DEST"
          
          if [ ! -s "$ASSET_DEST" ]; then
            echo "::error::Failed to copy valid APK to release destination $ASSET_DEST"
            exit 1
          fi
          
          echo "asset_path=$ASSET_DEST" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset at: $ASSET_DEST"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking gh CLI version..."
          gh --version
          
          ASSET_FILE="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_FILE" ]; then
            echo "::error::Prepared APK does not exist at $ASSET_FILE"
            exit 1
          fi
          
          if [ ! -s "$ASSET_FILE" ]; then
            echo "::error::Prepared APK is empty."
            exit 1
          fi
          
          ASSET_FILENAME=$(basename "$ASSET_FILE")
          if [ "$ASSET_FILENAME" != "app-debug.apk" ]; then
            echo "::error::Asset filename is '$ASSET_FILENAME', expected 'app-debug.apk'"
            exit 1
          fi
          
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          RELEASE_NOTES="### Automated Debug APK Build

- **Build Source**: Built automatically by GitHub Actions
- **Workflow Run Number**: ${{ github.run_number }}
- **Workflow Run Attempt**: ${{ github.run_attempt }}
- **Source Commit**: ${{ github.sha }}
- **Signing**: Signed with temporary debug keystore
- **Notice**: Intended for testing only, not for Google Play Store production release."
          
          echo "Creating release $RELEASE_TAG..."
          gh release create "$RELEASE_TAG" "$ASSET_FILE" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
          
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=== RELEASE SUCCESSFUL ==="
            gh release view "$RELEASE_TAG" || true
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release Page: https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"
            echo "APK Asset Name: app-debug.apk"
            echo "Direct Download URL: $DIRECT_URL"
            
            echo "### DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[Download app-debug.apk]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "*Note: The GitHub Actions artifact \`app-debug-apk\` remains available as a backup.*" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK was built successfully."
              echo "The GitHub Actions backup artifact 'app-debug-apk' remains available for download."
            fi
            echo "::warning::Direct download link may not reflect this build."
          fi
